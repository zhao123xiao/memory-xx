name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      MEMORY_V2_DATABASE_URL: postgres://postgres:postgres@localhost:5432/memory_xx_test
      MEMORY_V2_REDIS_URL: redis://localhost:6379/0
      MEMORY_V2_API_TOKEN: test-token
      OPENAI_API_KEY: test-key
      MEMORY_V2_LOG_LEVEL: error
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memory_xx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      - run: npm run test:gates

      - run: npm run test:integration

  test-postgres:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      MEMORY_V2_DATABASE_URL: postgres://postgres:postgres@localhost:5432/memory_xx_test
      MEMORY_V2_API_TOKEN: test-token
      OPENAI_API_KEY: test-key
      MEMORY_V2_LOG_LEVEL: error
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memory_xx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run test:postgres
