services:
  memory-xx:
    build: .
    ports:
      - "5100:5100"
    environment:
      MEMORY_XX_WRAPPER_PORT: "5100"
      MEMORY_XX_BIND_HOST: "0.0.0.0"
      MEMORY_XX_DATABASE_URL: postgres://postgres:postgres@postgres:5432/memory_xx
      MEMORY_XX_DATABASE_SCHEMA: memory_xx
      MEMORY_XX_REDIS_URL: redis://redis:6379/0
      MEMORY_XX_API_TOKEN: ${MEMORY_XX_API_TOKEN:-changeme}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5100/live').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: memory_xx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  qdrantdata:
