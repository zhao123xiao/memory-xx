services:
  memory-xx:
    build: .
    ports:
      - "5100:5100"
    environment:
      MEMORY_XX_RUNTIME_PROFILE: ${MEMORY_XX_RUNTIME_PROFILE:-core}
      MEMORY_XX_WRAPPER_PORT: "5100"
      MEMORY_XX_BIND_HOST: "0.0.0.0"
      MEMORY_XX_DATABASE_URL: postgres://postgres:postgres@postgres:5432/memory_xx
      MEMORY_XX_DATABASE_SCHEMA: memory_xx
      MEMORY_XX_REDIS_URL: redis://redis:6379/0
      MEMORY_XX_QDRANT_BASE_URL: http://qdrant:6333
      MEMORY_XX_QDRANT_COLLECTION: ${MEMORY_XX_QDRANT_COLLECTION:-memory-xx}
      MEMORY_XX_API_TOKEN: ${MEMORY_XX_API_TOKEN:-changeme}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-changeme}
      EMBEDDING_API_BASE: http://memory-xx-embedding-proxy:5221/v1
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen3-Embedding-8B}
      EMBEDDING_DIMS: ${EMBEDDING_DIMS:-4096}
      MEMORY_XX_FASTPATH_URL: http://memory-xx-fastpath:5200
      MEMORY_XX_RERANKER_ADAPTER_URL: http://memory-xx-reranker-adapter:8085
      MEMORY_INTELLIGENCE_MEM0_URL: http://memory-xx-mem0-extractor:5220
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      memory-xx-embedding-proxy:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5100/live').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  memory-xx-embedding-proxy:
    build: .
    command: ["node", "sidecars/embedding-proxy/embedding-proxy.mjs"]
    ports:
      - "5221:5221"
    environment:
      MEMORY_XX_EMBEDDING_PROXY_HOST: 0.0.0.0
      MEMORY_XX_EMBEDDING_PROXY_PORT: "5221"
      MEMORY_XX_EMBEDDING_PROXY_UPSTREAM_BASE: ${EMBEDDING_PROXY_UPSTREAM_BASE:-${EMBEDDING_API_BASE:-https://api.scnet.cn/api/llm/v1}}
      MEMORY_XX_EMBEDDING_PROXY_UPSTREAM_MODEL: ${EMBEDDING_PROXY_UPSTREAM_MODEL:-${EMBEDDING_MODEL:-Qwen3-Embedding-8B}}
      MEMORY_XX_EMBEDDING_PROXY_UPSTREAM_API_KEY: ${EMBEDDING_PROXY_UPSTREAM_API_KEY:-${OPENAI_API_KEY:-changeme}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-changeme}
    restart: unless-stopped

  memory-xx-fastpath:
    build: .
    profiles:
      - enhanced
    command: ["node", "sidecars/fastpath/fastpath.mjs"]
    ports:
      - "5200:5200"
    environment:
      MEMORY_XX_FASTPATH_ADDR: 0.0.0.0:5200
      MEMORY_XX_DATABASE_URL: postgres://postgres:postgres@postgres:5432/memory_xx
      MEMORY_XX_DATABASE_SCHEMA: memory_xx
      MEMORY_XX_REDIS_URL: redis://redis:6379/0
      MEMORY_XX_QDRANT_BASE_URL: http://qdrant:6333
      MEMORY_XX_FASTPATH_LEXICAL_URL: http://memory-xx-lexical-sidecar:5210
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  memory-xx-lexical-sidecar:
    build: .
    profiles:
      - enhanced
    command: ["node", "sidecars/lexical-sidecar/lexical-sidecar.mjs"]
    ports:
      - "5210:5210"
    environment:
      MEMORY_XX_LEXICAL_ADDR: 0.0.0.0:5210
      MEMORY_XX_DATABASE_URL: postgres://postgres:postgres@postgres:5432/memory_xx
      MEMORY_XX_DATABASE_SCHEMA: memory_xx
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  memory-xx-qdrant-proxy:
    build: .
    profiles:
      - enhanced
    command: ["node", "sidecars/qdrant-proxy/qdrant-collection-proxy.mjs"]
    ports:
      - "6334:6334"
    environment:
      MEMORY_XX_QDRANT_PROXY_HOST: 0.0.0.0
      MEMORY_XX_QDRANT_PROXY_PORT: "6334"
      MEMORY_XX_QDRANT_PROXY_UPSTREAM: http://qdrant:6333
      MEMORY_XX_QDRANT_PROXY_FROM_COLLECTION: ${MEMORY_XX_QDRANT_COLLECTION:-memory-xx}
      MEMORY_XX_QDRANT_PROXY_TO_COLLECTION: ${MEMORY_XX_QDRANT_ACTIVE_COLLECTION:-memory-xx-active}
    depends_on:
      qdrant:
        condition: service_started
    restart: unless-stopped

  memory-xx-reranker-adapter:
    build: .
    profiles:
      - enhanced
    command: ["node", "sidecars/reranker-adapter/reranker-adapter.mjs"]
    ports:
      - "8085:8085"
    environment:
      MEMORY_XX_RERANKER_ADAPTER_HOST: 0.0.0.0
      MEMORY_XX_RERANKER_ADAPTER_PORT: "8085"
      MEMORY_XX_RERANKER_DOWNSTREAM_URL: ${MEMORY_XX_RERANKER_DOWNSTREAM_URL:-http://host.docker.internal:8084/v3/rerank}
      MEMORY_XX_RERANKER_DOWNSTREAM_MODELS_URL: ${MEMORY_XX_RERANKER_DOWNSTREAM_MODELS_URL:-http://host.docker.internal:8084/v3/models}
    restart: unless-stopped

  memory-xx-control-panel:
    build: .
    profiles:
      - enhanced
    command: ["node", "--import", "tsx", "scripts/memory-control-panel.ts"]
    ports:
      - "5310:5310"
    environment:
      MEMORY_XX_CONTROL_PANEL_PORT: "5310"
      MEMORY_XX_PROJECT_ROOT: /app
      MEMORY_XX_DATABASE_URL: postgres://postgres:postgres@postgres:5432/memory_xx
      MEMORY_XX_DATABASE_SCHEMA: memory_xx
      MEMORY_XX_WRAPPER_URL: http://memory-xx:5100
      MEMORY_XX_API_TOKEN: ${MEMORY_XX_API_TOKEN:-changeme}
      MEMORY_XX_ADMIN_TOKEN: ${MEMORY_XX_ADMIN_TOKEN:-${MEMORY_XX_API_TOKEN:-changeme}}
    depends_on:
      memory-xx:
        condition: service_started
    restart: unless-stopped

  memory-xx-mem0-extractor:
    build: .
    profiles:
      - full
    command: ["python3", "sidecars/mem0-extractor/extractor.py"]
    ports:
      - "5220:5220"
    environment:
      MEMORY_XX_MEM0_EXTRACTOR_HOST: 0.0.0.0
      MEMORY_XX_MEM0_EXTRACTOR_PORT: "5220"
      MEMORY_XX_MEM0_BASE_URL: ${MEMORY_XX_MEM0_BASE_URL:-${MEMORY_INTELLIGENCE_BASE_URL:-}}
      MEMORY_XX_MEM0_MODEL: ${MEMORY_XX_MEM0_MODEL:-${MEMORY_INTELLIGENCE_MODEL:-MiniMax-M2.7-highspeed}}
      MEMORY_XX_MEM0_API_KEY: ${MEMORY_XX_MEM0_API_KEY:-${MEMORY_INTELLIGENCE_API_KEY:-}}
    restart: unless-stopped

  memory-xx-conversation-monitor:
    build: .
    profiles:
      - full
    command: ["node", "--import", "tsx", "scripts/run-conversation-monitor-worker.ts"]
    environment:
      MEMORY_XX_PROJECT_ROOT: /app
      MEMORY_XX_RUNTIME_DIR: /app/.runtime
      MEMORY_XX_DATABASE_URL: postgres://postgres:postgres@postgres:5432/memory_xx
      MEMORY_XX_DATABASE_SCHEMA: memory_xx
      MEMORY_XX_WRAPPER_URL: http://memory-xx:5100
      MEMORY_XX_API_TOKEN: ${MEMORY_XX_API_TOKEN:-changeme}
      MEMORY_XX_ADMIN_TOKEN: ${MEMORY_XX_ADMIN_TOKEN:-${MEMORY_XX_API_TOKEN:-changeme}}
      MEMORY_XX_CONVERSATION_MONITOR: ${MEMORY_XX_CONVERSATION_MONITOR:-false}
      MEMORY_XX_CONVERSATION_AUTO_EXTRACT: ${MEMORY_XX_CONVERSATION_AUTO_EXTRACT:-false}
    depends_on:
      memory-xx:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: memory_xx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  qdrantdata:
